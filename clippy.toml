# Transcendental functions come from `martensite-cmath`, which is correctly rounded and
# gives the same bits on every release platform. The standard methods lower to each
# platform's C math library, whose last bit differs between platforms, and constant
# arguments are folded with the build host's library (#201).
disallowed-methods = [
    { path = "f64::sin", reason = "use martensite_cmath::sin for platform-identical results (#201)" },
    { path = "f64::cos", reason = "use martensite_cmath::cos for platform-identical results (#201)" },
    { path = "f64::tan", reason = "use martensite_cmath::tan for platform-identical results (#201)" },
    { path = "f64::asin", reason = "use martensite_cmath::asin for platform-identical results (#201)" },
    { path = "f64::acos", reason = "use martensite_cmath::acos for platform-identical results (#201)" },
    { path = "f64::atan", reason = "use martensite_cmath::atan for platform-identical results (#201)" },
    { path = "f64::atan2", reason = "use martensite_cmath::atan2 for platform-identical results (#201)" },
    { path = "f64::sin_cos", reason = "use martensite_cmath::sincos for platform-identical results (#201)" },
    { path = "f64::sinh", reason = "use martensite_cmath::sinh for platform-identical results (#201)" },
    { path = "f64::cosh", reason = "use martensite_cmath::cosh for platform-identical results (#201)" },
    { path = "f64::tanh", reason = "use martensite_cmath::tanh for platform-identical results (#201)" },
    { path = "f64::asinh", reason = "use martensite_cmath::asinh for platform-identical results (#201)" },
    { path = "f64::acosh", reason = "use martensite_cmath::acosh for platform-identical results (#201)" },
    { path = "f64::atanh", reason = "use martensite_cmath::atanh for platform-identical results (#201)" },
    { path = "f64::exp", reason = "use martensite_cmath::exp for platform-identical results (#201)" },
