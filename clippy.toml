    { path = "f64::ln", reason = "use martensite_cmath::log for platform-identical results (#201)" },
    { path = "f64::log", reason = "use martensite_cmath::log2, log10 or log for platform-identical results (#201)" },
    { path = "f64::log2", reason = "use martensite_cmath::log2 for platform-identical results (#201)" },
    { path = "f64::log10", reason = "use martensite_cmath::log10 for platform-identical results (#201)" },
