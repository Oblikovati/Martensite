<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- System fonts only: the renderer's recorded images must not depend on a user's font folder. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/martensite-renderer-fontconfig-cache</cachedir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
