# Separate pinned nightly toolchain used exclusively by `cargo xtask` for
# multi-threaded `wasm32-unknown-unknown` (`+atomics` with `-Z build-std=panic_abort,std`).
# Native platforms continue using the stable toolchain in `/rust-toolchain.toml`.
[toolchain]
channel = "nightly-2026-09-25"
profile = "minimal"
components = ["rust-src", "clippy"]
targets = ["wasm32-unknown-unknown"]
