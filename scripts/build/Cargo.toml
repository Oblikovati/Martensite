[package]
name = "martensite-build"
version = "0.1.0"
description = "Martensite PR validation and release driver used by CI and contributors."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "martensite-build"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
proc-macro2 = "=1.0.107"

[lints]
workspace = true
