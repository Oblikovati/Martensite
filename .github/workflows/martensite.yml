# The only CI workflow. It installs host tooling and nothing else: every
# check, build, test and packaging step is `cargo xtask` (scripts/build), so a
# contributor runs exactly what CI runs. `cargo xtask ci plan` reads the
# trigger and chooses the pipeline and the target matrix:
#   pull_request        -> PR validation of changed files/packages, primary target
#   push of a v* tag    -> release on every target, then publish the GitHub release
#   workflow_dispatch   -> `pr` or a release rehearsal on every target (never publishes)
name: Martensite

on:
  pull_request:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      mode:
        description: "pr: validate this branch against main. release: rehearse a release on every target without publishing."
        type: choice
        options: [pr, release]
        default: release
        required: true
      version:
        description: "Version to rehearse in release mode, e.g. 0.3.0"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: martensite-${{ github.ref }}
  # A newer PR push supersedes the older run; releases always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Panic locations survive without debug info, and hundreds of linked test
  # binaries with it do not fit a runner disk.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_STRIP: debuginfo
  CARGO_PROFILE_TEST_STRIP: debuginfo
  # Dispatch inputs reach the driver as data, never interpolated into a script.
  MARTENSITE_CI_MODE: ${{ inputs.mode }}
  MARTENSITE_CI_VERSION: ${{ inputs.version }}
  # Every PR job compares the same event revision even if main advances (#273).
  MARTENSITE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      test-matrix: ${{ steps.plan.outputs.test-matrix }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
      has-sanitizer: ${{ steps.plan.outputs.has-sanitizer }}
      base-sha: ${{ steps.plan.outputs.base-sha }}
      release-history: ${{ steps.plan.outputs.release-history }}
      reuse-run: ${{ steps.reuse.outputs.reuse-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - id: plan
        run: cargo xtask ci plan
        env:
          GH_TOKEN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && github.token || '' }}

      - id: reuse
        run: cargo xtask ci reuse-plan
        env:
          MARTENSITE_RELEASE_HISTORY_SHA256: ${{ steps.plan.outputs.release-history }}
          GH_TOKEN: ${{ github.token }}

  checks:
    needs: plan
    if: needs.plan.outputs.reuse-run == ''
    env:
      MARTENSITE_CI_BASE_SHA: ${{ needs.plan.outputs.base-sha }}
      MARTENSITE_RELEASE_HISTORY_SHA256: ${{ needs.plan.outputs.release-history }}
    name: checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR validation needs the merge base; release checks need the tags.
          fetch-depth: 0
          # Dataset-backed tests read their inputs from external/martensite-test-data.
          submodules: true
      - if: runner.os == 'Linux'
        uses: ./.github/actions/free-runner-disk
      - uses: ./.github/actions/setup-target
      - run: cargo xtask ci run --target ${{ matrix.target }} --checks-only
        env:
          # Read the immutable historical archive assets during release checks (#279).
          GH_TOKEN: ${{ needs.plan.outputs.mode == 'release' && github.token || '' }}
      - name: Retain compiler unsafe inventory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsafe-inventory-${{ matrix.target }}
          path: |
            target/unsafe-inventory/latest.json
            target/unsafe-inventory/compiler.stdout.jsonl
            target/unsafe-inventory/compiler.stderr.txt
          if-no-files-found: ignore
      - if: needs.plan.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/v${{ needs.plan.outputs.version }}/
          # A library-only target ships no archive; the primary target always
          # ships the source crates, so publish still sees every asset.
          if-no-files-found: ignore

  tests:
    needs: plan
    env:
      MARTENSITE_CI_BASE_SHA: ${{ needs.plan.outputs.base-sha }}
    if: needs.plan.outputs.mode == 'pr' && needs.plan.outputs.has-tests == 'true'
    name: test (${{ matrix.package }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.test-matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      # PR test jobs only. The compiler inventory counts diagnostics, which a cache hit
      # does not fully replay, and release and sanitizer jobs build from scratch.
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          max-size: 2GiB
          cache-key-prefix: kache-${{ matrix.package }}
          pr-comment: false
      - if: contains(fromJSON('["martensite-vulkan", "martensite-tkvcaf", "martensite-tkxcaf", "martensite-tkfeat", "martensite-tkoffset", "martensite-tkdestl", "martensite-tkmeshvs", "martensite-tkdestep", "martensite-tkdeiges", "martensite-tkdeobj"]'), matrix.package)
        uses: ./.github/actions/setup-renderer-tests
      # The modelling suites link many large test binaries. Their script cases have CPU budgets that
      # assume light optimization, and the Boolean suite spends most of its time in dependencies.
      # The form feature and offset suites also end some cases on a shaded view, so they need the
      # renderer above. The STL, mesh presentation, STEP, IGES and OBJ suites draw on the real renderer too.
      - if: contains(fromJSON('["martensite-tkbo", "martensite-boolean-cases", "martensite-tkbool", "martensite-tkfillet", "martensite-tkcaf"]'), matrix.package)
        uses: ./.github/actions/free-runner-disk
      - if: contains(fromJSON('["martensite-tkbo", "martensite-boolean-cases", "martensite-tkbool", "martensite-tkfillet", "martensite-tkfeat", "martensite-tkoffset", "martensite-tkdestl", "martensite-tkmeshvs", "martensite-tkdestep", "martensite-tkdeiges", "martensite-tkdeobj"]'), matrix.package)
        run: echo "CARGO_PROFILE_DEV_OPT_LEVEL=1" >> "$GITHUB_ENV"
      - run: cargo xtask ci test --package "$TEST_PACKAGE" --target x86_64-unknown-linux-gnu
        env:
          TEST_PACKAGE: ${{ matrix.package }}

  release-tests:
    needs: plan
    env:
      MARTENSITE_CI_BASE_SHA: ${{ needs.plan.outputs.base-sha }}
      MARTENSITE_RELEASE_HISTORY_SHA256: ${{ needs.plan.outputs.release-history }}
    if: needs.plan.outputs.mode == 'release' && needs.plan.outputs.has-tests == 'true' && needs.plan.outputs.reuse-run == ''
    name: release tests (${{ matrix.target }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/setup-target
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-renderer-tests
      - run: cargo xtask ci test --shard "$TEST_SHARD" --target "$TEST_TARGET"
        shell: bash
        env:
          # Light optimization keeps the script cases inside their CPU budgets on small runners.
          CARGO_PROFILE_DEV_OPT_LEVEL: '1'
          TEST_SHARD: ${{ matrix.shard }}
          TEST_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}

  thread-sanitizer:
    needs: plan
    if: needs.plan.outputs.has-sanitizer == 'true' && needs.plan.outputs.reuse-run == ''
    env:
      MARTENSITE_CI_BASE_SHA: ${{ needs.plan.outputs.base-sha }}
      MARTENSITE_RELEASE_HISTORY_SHA256: ${{ needs.plan.outputs.release-history }}
      GH_TOKEN: ${{ needs.plan.outputs.mode == 'release' && github.token || '' }}
    name: thread sanitizer (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the ordinary driver toolchain
        run: rustup toolchain install
      - name: Install the pinned sanitizer toolchain and standard-library sources
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --component rust-src
      - run: cargo xtask ci thread-sanitizer

  verify:
    env:
      MARTENSITE_CI_BASE_SHA: ${{ needs.plan.outputs.base-sha }}
      MARTENSITE_RELEASE_HISTORY_SHA256: ${{ needs.plan.outputs.release-history }}
    needs: [plan, checks, tests, release-tests, thread-sanitizer]
    if: always()
    name: ${{ needs.plan.outputs.mode == 'release' && 'release' || 'pr (x86_64-unknown-linux-gnu)' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - name: Restore independently verified rehearsal artifacts
        if: needs.plan.outputs.reuse-run != ''
        run: cargo xtask ci reuse-verify --run "$REUSE_RUN" --dist dist
        env:
          REUSE_RUN: ${{ needs.plan.outputs.reuse-run }}
          GH_TOKEN: ${{ github.token }}
      - name: Require the unsuppressed Linux thread-sanitizer check
        if: needs.plan.outputs.reuse-run == ''
        run: cargo xtask ci gate --checks "$PLAN_RESULT" --tests "$SANITIZER_RESULT" $HAS_SANITIZER_FLAG
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_SANITIZER_FLAG: ${{ needs.plan.outputs.has-sanitizer == 'true' && '--has-tests' || '' }}
          SANITIZER_RESULT: ${{ needs.thread-sanitizer.result }}
      - if: needs.plan.outputs.reuse-run == ''
        run: cargo xtask ci gate --checks "$CHECKS_RESULT" --tests "$TESTS_RESULT" $HAS_TESTS_FLAG
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.plan.outputs.mode == 'release' && needs.release-tests.result || needs.tests.result }}
          HAS_TESTS_FLAG: ${{ needs.plan.outputs.has-tests == 'true' && '--has-tests' || '' }}

      - name: Seal successful rehearsal evidence
        if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.mode == 'release'
        run: cargo xtask ci seal-validation --directory validation
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-v${{ needs.plan.outputs.version }}-attempt-${{ github.run_attempt }}
          path: validation/release-validation.json
          if-no-files-found: error
      - if: needs.plan.outputs.reuse-run != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-reused
          path: dist/
          if-no-files-found: error

  publish:
    needs: [plan, checks, verify]
    # An intentionally skipped PR-only ancestor must not suppress verified tag publication (#350).
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == format('refs/tags/v{0}', needs.plan.outputs.version)
      && needs.plan.result == 'success'
      && needs.plan.outputs.publish == 'true'
      && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.plan.outputs.reuse-run != ''))
      && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cargo xtask ci publish --dist dist
        env:
          GH_TOKEN: ${{ github.token }}
