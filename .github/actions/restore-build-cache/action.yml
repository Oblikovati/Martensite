name: Restore the package build cache
description: >-
  Restores the kache store that the scheduled job saved on main for one package
  and starts kache on it without saving (#472). GitHub lets a pull request read
  caches saved on main but not another pull request's, and PR-saved stores
  filled the repository's 10 GB budget while helping only their own reruns.
inputs:
  package:
    description: The workspace package whose PR test build this store serves.
    required: true
outputs:
  key:
    description: The key a refresh job saves this package's store under.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "prefix=kache-$PACKAGE-$LOCK_HASH-" >> "$GITHUB_OUTPUT" && echo "key=kache-$PACKAGE-$LOCK_HASH-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      env:
        PACKAGE: ${{ inputs.package }}
        LOCK_HASH: ${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/kache
        key: ${{ steps.key.outputs.key }}
        # A store from older dependencies still holds every unchanged crate.
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          kache-${{ inputs.package }}-
    # The compiler inventory counts diagnostics, which a cache hit does not fully
    # replay, so only PR test jobs and the refresh job use this cache.
    - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        version: v2.0.0
        max-size: 2GiB
        github-cache: 'false'
        save-cache: 'false'
        cache-dir: ${{ runner.temp }}/kache
        pr-comment: false
