name: Renderer test setup
description: Installs the pinned Mesa lavapipe and Vulkan validation layer, and the fonts, for the renderer tests.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/free-runner-disk
    - name: Install lavapipe and the pinned validation layer
      shell: bash
      run: |
        sudo apt-get update
        # The system Mesa brings the driver's library dependencies; the pinned driver replaces it.
        sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libdisplay-info1 libsensors5 libdrm-intel1 fonts-dejavu fonts-dejavu-extra fonts-droid-fallback fonts-freefont-ttf fonts-liberation fonts-noto-cjk fonts-noto-core
        scripts/install/vulkan-validation.sh "$RUNNER_TEMP/vulkan-validation" --github-env "$GITHUB_ENV"
        # The recorded software images are fixed to a 128-bit SSE2 rasterizer.
        {
          echo "GALLIUM_OVERRIDE_CPU_CAPS=sse2"
          echo "LP_NATIVE_VECTOR_WIDTH=128"
          echo "LIBGL_ALWAYS_SOFTWARE=1"
          echo "MARTENSITE_VULKAN_DEVICE=0"
          echo "FONTCONFIG_FILE=$GITHUB_WORKSPACE/scripts/install/renderer-fontconfig.conf"
          # Light optimization keeps the regression cases inside their CPU limits on small runners.
          echo "CARGO_PROFILE_DEV_OPT_LEVEL=1"
        } >>"$GITHUB_ENV"
