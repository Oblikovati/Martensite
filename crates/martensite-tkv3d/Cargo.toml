[package]
autotests = false
name = "martensite-tkv3d"
version = "0.7.1"
description = "Martensite interactive visualization: selection, presentation, interactive objects and the 3D viewer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

# The workspace forbids unsafe code. This crate keeps one lifetime-erased destructor borrow and a borrowed C
# string view of externally maintained light names, so
# it denies unsafe code and lets each module that needs it opt in with
# `#[allow(unsafe_code)]` and a SAFETY comment on every unsafe block and impl (AGENTS.md,
# "Unsafe code exception"); clippy checks those comments. The other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkservice = { path = "../martensite-tkservice", version = "0.4.1" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.7" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkmesh = { path = "../martensite-tkmesh", version = "0.3.6" }
# Hidden line presentations run the hidden line removal algorithm.
martensite-tkhlr = { path = "../martensite-tkhlr", version = "0.3.6" }

[dev-dependencies]
martensite-test-support = { path = "../martensite-test-support", version = "0.3.6" }
# Real closed volume fixtures reuse the primitive topology implementation.
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Abort checks reexecute exact test names.
[[test]]
name = "ais_context_fatal"
path = "tests/ais_context_fatal.rs"

