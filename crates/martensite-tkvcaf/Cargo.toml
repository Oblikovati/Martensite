[package]
autotests = false
name = "martensite-tkvcaf"
version = "0.9.1"
description = "Martensite document presentation attributes and their drivers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.6" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkservice = { path = "../martensite-tkservice", version = "0.4.1" }
martensite-tkv3d = { path = "../martensite-tkv3d", version = "0.7.0" }
martensite-tkcdf = { path = "../martensite-tkcdf", version = "0.3.6" }
martensite-tklcaf = { path = "../martensite-tklcaf", version = "0.3.5" }
martensite-tkcaf = { path = "../martensite-tkcaf", version = "0.8.0" }

[dev-dependencies]
martensite-boolean-cases = { path = "../martensite-boolean-cases", version = "0.8.0" }
martensite-process-policy = { path = "../martensite-process-policy", version = "0.4.0", features = ["case-runner"] }
martensite-vulkan = { path = "../martensite-vulkan", version = "0.7.1" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

[[test]]
name = "caf_cases"
path = "tests/caf_cases.rs"

[[test]]
name = "document_presentation_view"
path = "tests/document_presentation_view.rs"

[[test]]
name = "document_mode_view"
path = "tests/document_mode_view.rs"

[[test]]
name = "document_selection_view"
path = "tests/document_selection_view.rs"

[[test]]
name = "document_material_view"
path = "tests/document_material_view.rs"

[[test]]
name = "document_transparency_view"
path = "tests/document_transparency_view.rs"
