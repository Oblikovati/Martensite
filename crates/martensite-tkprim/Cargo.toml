[package]
autotests = false
name = "martensite-tkprim"
version = "0.3.5"
description = "Martensite primitive solids: boxes, wedges, revolved bodies, and linear and rotational sweeps."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.5" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.5" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.5" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.5" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.5" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.5" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.3.5" }

[dev-dependencies]
sha2 = "0.10"
# `bugs_modalg_7::bug28248` runs the hidden-line commands on two primitives. Path only:
# the hidden-line tests use this crate in turn, and source packages drop the entry.
martensite-tkhlr = { path = "../martensite-tkhlr" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# The dataset-backed cases, each alone in a child process under its group budget.
[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"

[[test]]
name = "gprop_primitives"
path = "tests/gprop_primitives.rs"
