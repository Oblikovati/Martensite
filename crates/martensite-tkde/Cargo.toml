[package]
autotests = false
name = "martensite-tkde"
version = "0.9.0"
description = "Martensite data exchange framework: configuration nodes, providers and the format registry."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tklcaf = { path = "../martensite-tklcaf", version = "0.3.5" }

[dev-dependencies]
tempfile = "=3.27.0"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Exercises the process-wide plugin registry without racing the toolkit replay.
[[test]]
name = "de_plugin_lifecycle"
path = "tests/de_plugin_lifecycle.rs"
