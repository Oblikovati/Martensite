[package]
autotests = false
name = "martensite-tktopalgo"
version = "0.4.0"
description = "Martensite topological algorithms: shape construction, classification, checking, extrema, bounds and properties."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.0" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.5" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.5" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.5" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.6" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.7" }

[dev-dependencies]
sha2 = "0.10"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"

# The CPU-timing case alone, so no other test of its binary runs meanwhile.
[[test]]
name = "dataset_timing"
path = "tests/dataset_timing.rs"

# Mutates the process-wide default plane.
[[test]]
name = "brep_lib_makers"
path = "tests/brep_lib_makers.rs"

# Mutates the process-wide exception stack capture setting.
[[test]]
name = "extrema_exception_capture"
path = "tests/extrema_exception_capture.rs"
