[package]
autotests = false
name = "martensite-tkhlr"
version = "0.3.4"
description = "Martensite hidden line removal: interval sets, polyhedral and exact hidden lines, contour lines and their shapes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.4" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.4" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.4" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.4" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.4" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.4" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.4" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.4" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.3.4" }

[dev-dependencies]
sha2 = "0.10"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Observes the process-wide contour sampling range across calls.
[[test]]
name = "contap_hcont_tool"
path = "tests/contap_hcont_tool.rs"

# Exception capture configuration is process-wide; this one test owns its process.
[[test]]
name = "contap_analytic_failure_capture"
path = "tests/contap_analytic_failure_capture.rs"

# Differential sampling comparisons must not share a process with unrelated setters.
[[test]]
name = "sampling_context"
path = "tests/sampling_context.rs"

# The dataset-backed cases, each alone in a child process under the bugs group budget.
[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"
