[package]
autotests = false
name = "martensite-tkhlr"
version = "0.3.5"
description = "Martensite hidden line removal: interval sets, polyhedral and exact hidden lines, contour lines and their shapes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.5" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.5" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.5" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.5" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.5" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.5" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.3.5" }

[dev-dependencies]
sha2 = "0.10"
# The request replays project primitive solids. Path only: the primitive cases use this
# crate in turn, and source packages drop the entry.
martensite-tkprim = { path = "../martensite-tkprim" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Observes the process-wide contour sampling range across calls.
[[test]]
name = "contap_hcont_tool"
path = "tests/contap_hcont_tool.rs"

# Exception capture configuration is process-wide; this one test owns its process.
[[test]]
name = "contap_analytic_failure_capture"
path = "tests/contap_analytic_failure_capture.rs"

# Normal sampling spans multiple calls; this target owns and serializes that context.
[[test]]
name = "function_numeric"
path = "tests/function_numeric.rs"

# Differential comparisons must not share a process with unrelated setters.
[[test]]
name = "sampling_context"
path = "tests/sampling_context.rs"

# Original sampling reports observe cross-surface range sharing and failures.
[[test]]
name = "sampling_numeric"
path = "tests/sampling_numeric.rs"

# SearchInside calls the shared sampler internally; replay owns that process context.
[[test]]
name = "search_numeric"
path = "tests/search_numeric.rs"

# Boundary and walking keep the shared sampler and own their replay process context.
[[test]]
name = "boundary_walking_numeric"
path = "tests/boundary_walking_numeric.rs"

[[test]]
name = "reflection_numeric"
path = "tests/reflection_numeric.rs"

[[test]]
name = "polygonal_numeric"
path = "tests/polygonal_numeric.rs"
# Full historical contour pipeline owns its shared sampling context.
[[test]]
name = "outliner_numeric"
path = "tests/outliner_numeric.rs"

# Full data loading retains shared contour sampling context for compatibility replay.
[[test]]
name = "data_numeric"
path = "tests/data_numeric.rs"

# Hiding replay preserves the shared contour sampling context in its own process.
[[test]]
name = "hider_numeric"
path = "tests/hider_numeric.rs"

# Algorithm replay preserves shared contour context in its own process.
[[test]]
name = "algo_numeric"
path = "tests/algo_numeric.rs"

# The dataset-backed cases, each alone in a child process under the bugs group budget.
[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"
