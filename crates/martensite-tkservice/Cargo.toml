[package]
autotests = false
name = "martensite-tkservice"
version = "0.6.1"
description = "Martensite visualization services: windows and events, images, fonts, graphic aspects, cameras, lights, textures, shaders and media."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

# The workspace forbids unsafe code. This crate loads the display, font and font
# configuration libraries at run time and calls them through C interfaces, and keeps
# raw pixel storage, so it denies unsafe code and lets each module that needs it opt
# in with `#[allow(unsafe_code)]` and a SAFETY comment on every unsafe block and impl
# (AGENTS.md, "Unsafe code exception"); clippy checks those comments. The other lints
# match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[features]
# Native display assertions require a live X11 server; enable explicitly in that environment.
x11-integration-tests = []
# Native Wayland assertions require a live Wayland compositor; enable explicitly in that environment.
wayland-integration-tests = []
# The font corpus families compare the host font database and faces with a recording
# made on the reference Linux machine; enable them only on a machine with those fonts.
host-font-corpus = []
# Browser WebAssembly canvas and DOM input surface (#632).
wasm-browser = []
# Native AppKit window assertions need a macOS login session (a window server); enable
# explicitly there. They run on the process main thread, so their binary has no harness.
appkit-integration-tests = []

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
martensite-cmath = { path = "../martensite-cmath", version = "0.3.6" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.5.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.4.2" }
# PNG, JPEG, BMP and GIF files. 0.25.6 is the last release whose required dependencies all
# carry licences that deny.toml allows (later releases add a BSD-3-Clause colour manager).
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
send_wrapper = "=0.6.0"
swash = { version = "=0.2.10", default-features = false, features = ["render", "scale", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = [
    "DomRect",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "MouseEvent",
    "OffscreenCanvas",
    "PointerEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "WheelEvent",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "=2.21.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# The AppKit backend of Cocoa_Window, Cocoa_LocalPool and the CAMetalLayer that Vulkan
# presents to. The objc2 family matches the versions wgpu already locks.
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSApplication",
    "NSColorSpace",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSObject",
    "NSString",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "CALayer",
    "CAMetalLayer",
] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "user"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Input"] }

# The AppKit integration binary creates the NSApplication it tests against.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# AppKit requires the process main thread, which libtest never runs tests on.
[[test]]
name = "appkit_window"
path = "tests/appkit_window.rs"
harness = false
required-features = ["appkit-integration-tests"]
