[package]
autotests = false
name = "martensite-tkcaf"
version = "0.8.0"
description = "Martensite topological naming, the extended document attributes and the standard application."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.7" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.6" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkbo = { path = "../martensite-tkbo", version = "0.8.0" }
martensite-tkcdf = { path = "../martensite-tkcdf", version = "0.3.6" }
martensite-tklcaf = { path = "../martensite-tklcaf", version = "0.3.5" }

[dev-dependencies]
martensite-geometry-raster = { path = "../martensite-geometry-raster", version = "0.7.0" }
martensite-raster-core = { path = "../martensite-raster-core", version = "0.7.0" }
martensite-tkfillet = { path = "../martensite-tkfillet", version = "0.8.0" }
martensite-tkbool = { path = "../martensite-tkbool", version = "0.8.0" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }
martensite-process-policy = { path = "../martensite-process-policy", version = "0.4.0", features = ["case-runner"] }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

[[test]]
name = "caf_case_policy_contract"
path = "tests/caf_case_policy_contract.rs"

[[test]]
name = "caf_unicode_policy_contract"
path = "tests/caf_unicode_policy_contract.rs"

[[test]]
name = "caf_bugs_policy_contract"
path = "tests/caf_bugs_policy_contract.rs"

[[test]]
name = "owned_document_presentation_contract"
path = "tests/owned_document_presentation_contract.rs"
