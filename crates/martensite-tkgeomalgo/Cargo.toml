[package]
autotests = false
name = "martensite-tkgeomalgo"
version = "0.3.7"
description = "Martensite geometric algorithms: intersections, hatching, tangent constraint solving, filling, plate surfaces and laws."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.0" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.5" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.5" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.5" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.6" }

[dev-dependencies]
sha2 = "0.10"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# These context switches need an isolated executable, not a shared test thread.
[[test]]
name = "blend-corpus"
path = "tests/blend_corpus_replay.rs"

[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"

[[test]]
name = "intpatch-accessor-contract"
path = "tests/intpatch_accessor_contract.rs"
