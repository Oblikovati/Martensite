[package]
autotests = false
name = "martensite-tkexpress"
version = "0.3.6"
description = "Martensite symbolic expressions, relations, functions and text interpreter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.6" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.6" }

[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Trace policy is process-wide, so this contract runs outside the parallel toolkit suite.
[[test]]
name = "failure_stack_contract"
path = "tests/failure_stack_contract.rs"
