[package]
autotests = false
name = "martensite-tkbool"
version = "0.8.0"
description = "Martensite topological operations: section and face intersection, sweeps, evolved shapes, projections and their data structures."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.7" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.6" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkshhealing = { path = "../martensite-tkshhealing", version = "0.3.7" }
martensite-tkbo = { path = "../martensite-tkbo", version = "0.8.0" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }

[dev-dependencies]
martensite-boolean-cases = { path = "../martensite-boolean-cases", version = "0.8.0" }
martensite-geometry-raster = { path = "../martensite-geometry-raster", version = "0.7.0" }
martensite-raster-core = { path = "../martensite-raster-core", version = "0.7.0" }
martensite-process-policy = { path = "../martensite-process-policy", version = "0.4.0", features = ["case-runner"] }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# The case scripts of this toolkit, on the contract of the boolean cases.
[[test]]
name = "dataset_cases"
path = "tests/dataset_cases/main.rs"

