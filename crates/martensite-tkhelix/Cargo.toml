[package]
autotests = false
name = "martensite-tkhelix"
version = "0.3.6"
description = "Martensite helix curves, their B-spline approximation and composite helix wires."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.6" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.6" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.6" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.6" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.6" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.6" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.6" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.3.6" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
