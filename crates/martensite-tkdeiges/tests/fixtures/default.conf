!*****************************************************************************
!Configuration Node  Vendor: Martensite Format: IGES
!
!Common parameters:
!
!
!Manages the continuity of BSpline curves (IGES entities 106, 112 and 126) after translation to Martensite
!Default value: 1. Available values: 0, 1, 2
provider.IGES.Martensite.read.iges.bspline.continuity :	 1
!
!
!Reads the precision mode value
!Default value: "File"(0). Available values: "File"(0), "User"(1)
provider.IGES.Martensite.read.precision.mode :	 0
!
!
!This parameter gives the precision for shape construction when the read.precision.mode parameter value is 1
!Default value: 0.0001. Available values: any real positive (non null) value
provider.IGES.Martensite.read.precision.val :	 0.0001
!
!
!Defines the mode of applying the maximum allowed tolerance
!Default value: "Preferred"(0). Available values: "Preferred"(0), "Forced"(1)
provider.IGES.Martensite.read.maxprecision.mode :	 0
!
!
!Defines the maximum allowable tolerance (in internal units, which are specified in xstep.cascade.unit) of the shape
!Default value: 1. Available values: any real positive (non null) value
provider.IGES.Martensite.read.maxprecision.val :	 1
!
!
!Defines the using of BRepLib::SameParameter
!Default value: "Off"(0). Available values: "Off"(0), "On"(0)
provider.IGES.Martensite.read.stdsameparameter.mode :	 0
!
!
!Preference for the computation of curves in case of 2D/3D inconsistency in an entity which has both 2D and 3D representations.
!Default value: "Default"(0). Available values: "Default"(0), "2DUse_Preferred"(2), "2DUse_Forced"(-2), "3DUse_Preferred"(3), "3DUse_Forced"(-3)
provider.IGES.Martensite.read.surfacecurve.mode :	 0
!
!
!This parameter is used within the BRepLib::EncodeRegularity() function which is called for a shape read from an IGES or a STEP file at the end of translation process.This function sets the regularity flag of an edge in a shell when this edge is shared by two faces.This flag shows the continuity, which these two faces are connected with at that edge.
!Default value (in degrees): 0.57295779513. Available values: <double>
provider.IGES.Martensite.read.encoderegularity.angle :	 0.572958
!
!
!Read parameters:
!
!
!If set to True, it affects the translation of bspline curves of degree 1 from IGES: these curves(which geometrically are polylines) are split by duplicated points, and the translator attempts to convert each of the obtained parts to a bspline of a higher continuity
!Default value: "Off"(0). Available values: "Off"(0), "On"(1)
provider.IGES.Martensite.read.bspline.approxd1.mode :	 0
!
!
!Parameter for reading fa-iled entities
!Default value: "Off"(0). Available values: "Off"(0), "On"(1)
provider.IGES.Martensite.read.fau_lty.entities :	 0
!
!
!Controls transferring invisible sub entities which logically depend on the grouping entities
!Default value: "Off"(0). Available values: "Off"(0), "On"(1)
provider.IGES.Martensite.read.onlyvisible :	 0
!
!
!Setting up the ColorMode parameter which is used to indicate read Colors or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.read.color :	 1
!
!
!Setting up the NameMode parameter which is used to indicate read Names or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.read.name :	 1
!
!
!Setting up the LayerMode parameter which is used to indicate read Layers or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.read.layer :	 1
!
!
!Write parameters:
!
!
!Flag to define entities type to write
!Default value: "Faces"(0). Available values: "Faces"(0), "BRep"(1)
provider.IGES.Martensite.write.brep.mode :	 0
!
!
!When writing to IGES in the BRep mode, this parameter indicates whether elementary surfaces(cylindrical, conical, spherical, and toroidal) are converted into corresponding IGES 5.3 entities(if the value of a parameter value is On), or written as surfaces of revolution(by default)
!Default value: "Off"(0). Available values: "Off"(0), "On"(1)
provider.IGES.Martensite.write.convertsurface.mode :	 0
!
!
!Gives the name of the author of the file
!Default value: "Martensite". Available values: <string>
provider.IGES.Martensite.write.header.author :	 
!
!
!Gives the name of the sending company
!Default value: (empty). Available values: <string>
provider.IGES.Martensite.write.header.company :	 
!
!
!Gives the name of the sending product
!Default value: "Martensite IGES processor Vx.x" (where x.x means the current Martensite version). Available values: <string>
provider.IGES.Martensite.write.header.product :	 
!
!
!Gives the name of the receiving company
!Default value: (empty). Available values: <string>
provider.IGES.Martensite.write.header.receiver :	 
!
!
!Specifies the mode of writing the resolution value into the IGES file
!Default value: Average(0). Available values: "Least"(-1), "Average"(0), "Greatest"(1), "Session"(2)
provider.IGES.Martensite.write.precision.mode :	 0
!
!
!This parameter gives the resolution value for an IGES file when the write.precision.mode parameter value is 1
!Default value: 0.0001. Available values: any real positive (non null) value
provider.IGES.Martensite.write.precision.val :	 0.0001
!
!
!Writing planes mode
!Default value: "Plane"(0). Available values: "Plane"(0), "BSpline"(1)
provider.IGES.Martensite.write.plane.mode :	 0
!
!
!Writing offset curves like BSplines
!Default value: "Off"(0). Available values: "Off"(0), "On"(1)
provider.IGES.Martensite.write.offset :	 0
!
!
!Setting up the ColorMode parameter which is used to indicate write Colors or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.write.color :	 1
!
!
!Setting up the NameMode parameter which is used to indicate write Names or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.write.name :	 1
!
!
!Setting up the LayerMode parameter which is used to indicate write Layers or not
!Default value: 1. Available values: 0, 1
provider.IGES.Martensite.write.layer :	 1
!
!
!Shape healing parameters:
!
!
!Defines the maximum allowable tolerance
!Default value: 1.e-6. Available values: any real positive (non null) value
provider.IGES.Martensite.healing.tolerance3d :	 1e-06
!
!
!Defines the maximum allowable tolerance
!Default value: 1.0. Available values: any real positive (non null) value
provider.IGES.Martensite.healing.max.tolerance3d :	 1
!
!
!Defines the minimum allowable tolerance
!Default value: 1.e-7. Available values: any real positive (non null) value
provider.IGES.Martensite.healing.min.tolerance3d :	 1e-07
!
!
!Defines the mode for applying fixes of shells for shapes
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.free.shell :	 -1
!
!
!Defines the mode for applying fixes of faces for shapes
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.free.face :	 -1
!
!
!Defines the mode for applying fixes of wires for shapes
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.free.wire :	 -1
!
!
!Defines the mode for applying ShapeFix::SameParameter after all fixes
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.same.parameter :	 -1
!
!
!Defines the mode for applying fixes of solids
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.solid :	 -1
!
!
!Defines the mode for applying analysis and fixes of orientation of shells in the solid
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.shell.orientation :	 -1
!
!
!Defines the mode for creation of solids. If operation is executed then solids are created from open shells else solids are created from closed shells only
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.create.open.solid :	 1
!
!
!Defines the mode for applying fixes of shells for solids
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.shell :	 -1
!
!
!Defines the mode for applying analysis and fixes of orientation of faces in the shell
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.face.orientation :	 -1
!
!
!Defines the mode for applying fixes of faces
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.face :	 -1
!
!
!Defines the mode for applying fixes of wires
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.wire :	 -1
!
!
!Defines the mode for applying a fix for the orientation of faces in the shell
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.orientation :	 -1
!
!
!Defines the add natural bound mode. If operation is executed then natural boundary is added on faces that miss them
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.add.natural.bound :	 -1
!
!
!Defines the fix missing seam mode (tries to insert seam is missed)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.missing.seam :	 -1
!
!
!Defines the fix small area wire mode (drops small wires)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.small.area.wire :	 -1
!
!
!Defines the remove face with small area (drops faces with small outer wires)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.remove.small.area.face :	 -1
!
!
!Defines the fix intersecting wires mode in faces
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.intersecting.wires :	 -1
!
!
!Defines the fix loop wires mode in faces
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.loop.wires :	 -1
!
!
!Defines the fix split face mode in faces
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.split.face :	 -1
!
!
!Defines the auto-correct precision mode in faces
!Default value: "Fix"(1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.auto.correct.precision :	 1
!
!
!Defines the mode allowed to modify topology of the wire during fixing (adding/removing edges etc.)
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.modify.topology :	 0
!
!
!Defines the mode allowed to modify geometry of the edges and vertices
!Default value: "Fix"(1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.modify.geometry :	 1
!
!
!Defines the mode allowed to defines whether the wire is to be closed (by calling methods like FixDegenerated() !and FixConnected() for lastand first edges
!Default value: "Fix"(1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.closed.wire :	 1
!
!
!Defines the mode allowed to defines the 2d representation of the wire is preferable over 3d one (in the case of ambiguity in FixEdgeCurves)
!and FixConnected() for lastand first edges
!Default value: "Fix"(1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.preference.pcurve :	 1
!
!
!Defines the mode allowed to reorder edges in the wire
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.reorder.edges :	 -1
!
!
!Defines the mode allowed to remove small edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.remove.small.edges :	 -1
!
!
!Defines the mode for fix connecting edges in the wire
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.connected.edges :	 -1
!
!
!Defines the mode for fix edges (3Dcurves and 2D curves)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.edge.curves :	 -1
!
!
!Defines the mode for add degenerated edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.add.degenerated.edges :	 -1
!
!
!Defines the mode for add lacking edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.add.lacking.edges :	 -1
!
!
!Defines the mode for fix selfintersection edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.selfintersection :	 -1
!
!
!Defines the mode allowed to remove loop
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.remove.loop :	 -1
!
!
!Defines the mode allowed to fix edge if pcurve is directed opposite to 3d curve
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.reversed2d :	 -1
!
!
!Defines the mode allowed to remove the pcurve(s) of the edge if it does not match the vertices
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.remove.pcurve :	 -1
!
!
!Defines the mode allowed to remove 3d curve of the edge if it does not match the vertices
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.remove.curve3d :	 -1
!
!
!Defines the mode allowed to add pcurve(s) of the edge if missing (by projecting 3d curve)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.add.pcurve :	 -1
!
!
!Defines the mode allowed to build 3d curve of the edge if missing
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.add.curve3d :	 -1
!
!
!Defines the mode allowed to correct order of pcurves in the seam edge depends on its orientation
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.correct.order.in.seam :	 -1
!
!
!Defines the mode allowed to shifts wrong 2D curves back, ensuring that the 2D curves of the edges in the wire are connected
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.shifted :	 -1
!
!
!Defines the mode for applying EdgeSameParameter
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.edge.same.parameter :	 0
!
!
!Defines the mode for fix notched edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.notched.edges :	 -1
!
!
!Defines the mode for fix tail in wire
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.tail :	 -1
!
!
!Defines the mode for max angle of the tails
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.max.tail.angle :	 -1
!
!
!Defines the mode for max tail width
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.max.tail.width :	 -1
!
!
!Defines the mode for fix selfintersecting of edge
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.selfintersecting.edge :	 -1
!
!
!Defines the mode for fix intersecting edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.intersecting.edges :	 -1
!
!
!Defines the mode for fix non adjacent intersecting edges
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.nonadjacent.intersecting.edges :	 -1
!
!
!Defines the mode for applying ShapeFix::FixVertexPosition before all fixes
!Default value: "NotFix"(0). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.vertex.position :	 0
!
!
!Defines the mode for increases the tolerances of the edge vertices to comprise !the ends of 3d curve and pcurve on the given face (first method) or all pcurves stored in an edge (second one)
!Default value: "FixOrNot"(-1). Available values: "FixOrNot"(-1), "NotFix"(0), "Fix"(1)
provider.IGES.Martensite.healing.vertex.tolerance :	 -1
!
!*****************************************************************************
