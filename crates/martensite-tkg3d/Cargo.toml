[package]
autotests = false
name = "martensite-tkg3d"
version = "0.3.6"
description = "Martensite spatial geometry: curves, surfaces, adaptors and evaluation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.6" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.3.6" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.6" }

[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

[[test]]
name = "geom_eval_stack_capture"
path = "tests/geom_eval_stack_capture.rs"
