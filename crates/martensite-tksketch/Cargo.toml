[package]
autotests = false
name = "martensite-tksketch"
version = "0.1.1"
description = "Martensite surface-bound sketches and physical normal extrusion."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkbo = { path = "../martensite-tkbo", version = "0.9.1" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.5.1" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.4.1" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.4.1" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.4.1" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.4.1" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.4.1" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.4.1" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.5.1" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.4.1" }
martensite-tksketch3d = { path = "../martensite-tksketch3d", version = "0.1.0" }

martensite-tkoffset = { path = "../martensite-tkoffset", version = "0.11.1" }

[dev-dependencies]
static_assertions = "=1.1.0"

[[test]]
name = "surface_sketch"
path = "tests/surface_sketch/main.rs"

[[test]]
name = "spatial_prism"
path = "tests/spatial_prism.rs"

[[test]]
name = "spatial_loft"
path = "tests/spatial_loft.rs"

[[test]]
name = "spatial_sweep"
path = "tests/spatial_sweep.rs"
