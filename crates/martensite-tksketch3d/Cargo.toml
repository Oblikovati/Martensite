[package]
autotests = false
name = "martensite-tksketch3d"
version = "0.1.0"
description = "Martensite spatial sketch values and atomic geometry edits."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.4.0" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.4.0" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.5.0" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.4.0" }
martensite-tksolve = { path = "../martensite-tksolve", version = "0.1.0", features = ["sketch3d-preview"] }

[dev-dependencies]
martensite-tkbo = { path = "../martensite-tkbo", version = "0.9.0" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.4.0" }
martensite-tkoffset = { path = "../martensite-tkoffset", version = "0.11.0" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.4.0" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.5.0" }

[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
