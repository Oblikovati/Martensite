[package]
autotests = false
name = "martensite-vulkan"
version = "0.7.0"
description = "Martensite Vulkan 1.3 visualization renderer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

# The workspace forbids unsafe code. This crate calls the Vulkan API through `ash`, and its tests read process
# allocator statistics and load the capture layer, so
# it denies unsafe code and lets each module that needs it opt in with
# `#[allow(unsafe_code)]` and a SAFETY comment on every unsafe block and impl (AGENTS.md,
# "Unsafe code exception"); clippy checks those comments. The other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[features]
# Temporary diagnostic; delete after bug30412 raster ordering is resolved.
command-state-diagnostics = ["dep:serde_json"]
# Owned uploaded ray inputs; explicit observation only, never a rendering policy.
raytrace-input-diagnostics = ["command-state-diagnostics"]
# Diagnostic-only production-intersection origin intervention, never qualification.
raytrace-hit-diagnostics = ["raytrace-input-diagnostics", "dep:sha2"]
# Temporary command omission proof; never selected by default.
lit-only-command-diagnostics = ["command-state-diagnostics"]
# Temporary original-draw vertex observation; no default shader or pipeline change.
vertex-output-diagnostics = ["command-state-diagnostics"]
# Selects only the owned manual window proof target; production code is unchanged.
owned-raster-x11-smoke = []

[dependencies]
martensite-cmath = { path = "../martensite-cmath", version = "0.3.5" }
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkservice = { path = "../martensite-tkservice", version = "0.4.1" }
ash = "=0.38.0"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
serde_json = { version = "=1.0.154", optional = true }
sha2 = { version = "=0.11.1", optional = true }

[dev-dependencies]
martensite-test-support = { path = "../martensite-test-support", version = "0.3.6" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.7" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.8" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.5" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkmesh = { path = "../martensite-tkmesh", version = "0.3.6" }
martensite-tkhlr = { path = "../martensite-tkhlr", version = "0.3.6" }
martensite-tkshhealing = { path = "../martensite-tkshhealing", version = "0.3.6" }
martensite-tkv3d = { path = "../martensite-tkv3d", version = "0.7.0" }
martensite-topology-test-support = { path = "../martensite-topology-test-support", version = "0.7.0" }
martensite-geometry-raster = { path = "../martensite-geometry-raster", version = "0.7.0" }
martensite-raster-core = { path = "../martensite-raster-core", version = "0.7.0" }
martensite-process-policy = { path = "../martensite-process-policy", version = "0.4.0", features = ["case-runner"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11-dl = "=2.21.0"

