[package]
autotests = false
name = "martensite-tkxcaf"
version = "0.9.0"
description = "Martensite extended exchange document: shapes, colors, layers, materials, dimensions and tolerances, notes, views and their presentation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
martensite-tkernel = { path = "../martensite-tkernel", version = "0.4.2" }
martensite-tkmath = { path = "../martensite-tkmath", version = "0.3.6" }
martensite-tkg2d = { path = "../martensite-tkg2d", version = "0.3.7" }
martensite-tkg3d = { path = "../martensite-tkg3d", version = "0.3.7" }
martensite-tkgeombase = { path = "../martensite-tkgeombase", version = "0.3.6" }
martensite-tkbrep = { path = "../martensite-tkbrep", version = "0.3.8" }
martensite-tktopalgo = { path = "../martensite-tktopalgo", version = "0.4.1" }
martensite-tkservice = { path = "../martensite-tkservice", version = "0.4.1" }
martensite-tkv3d = { path = "../martensite-tkv3d", version = "0.7.0" }
martensite-tkcdf = { path = "../martensite-tkcdf", version = "0.3.6" }
martensite-tklcaf = { path = "../martensite-tklcaf", version = "0.3.5" }
martensite-tkcaf = { path = "../martensite-tkcaf", version = "0.8.0" }
martensite-tkvcaf = { path = "../martensite-tkvcaf", version = "0.9.0" }

[dev-dependencies]
martensite-process-policy = { path = "../martensite-process-policy", version = "0.4.0", features = ["case-runner"] }
martensite-tkxsbase = { path = "../martensite-tkxsbase", version = "0.9.0" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
martensite-vulkan = { path = "../martensite-vulkan", version = "0.7.1" }
martensite-test-support = { path = "../martensite-test-support", version = "0.3.6" }
martensite-tkprim = { path = "../martensite-tkprim", version = "0.3.7" }
martensite-tkgeomalgo = { path = "../martensite-tkgeomalgo", version = "0.3.8" }
martensite-tkbo = { path = "../martensite-tkbo", version = "0.8.0" }
martensite-tkbool = { path = "../martensite-tkbool", version = "0.8.0" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# This suite mutates the process-wide shape naming flag. Editor tests temporarily
# change that flag too; a separate binary preserves the original default-state assertion.
[[test]]
name = "xcafdoc"
path = "tests/xcafdoc.rs"

# Expansion temporarily changes process-wide shape naming. Each mutator runs
# alone so unrelated cases retain the original fresh-process defaults.
[[test]]
name = "editor_expansion"
path = "tests/editor_expansion.rs"

[[test]]
name = "compound_color_expansion"
path = "tests/compound_color_expansion.rs"

# The display/document teardown case needs a real AIS renderer in its own process.
[[test]]
name = "viewer_document_close"
path = "tests/viewer_document_close.rs"

[[test]]
name = "repeated_document_show"
path = "tests/repeated_document_show.rs"

[[test]]
name = "empty_compound_shaded"
path = "tests/empty_compound_shaded.rs"

[[test]]
name = "empty_compound_bounding"
path = "tests/empty_compound_bounding.rs"

[[test]]
name = "presentation_properties"
path = "tests/presentation_properties.rs"

# Process-isolated transfer-unit settings do not race the shape suites.
[[test]]
name = "shape_document_units"
path = "tests/shape_document_units.rs"

# Reading a pixel needs a real renderer in its own process.
[[test]]
name = "color_alpha_view"
path = "tests/color_alpha_view.rs"

# Each sample owns a viewer and runs alone in a child process.
[[test]]
name = "demo_samples"
path = "tests/demo_samples.rs"
