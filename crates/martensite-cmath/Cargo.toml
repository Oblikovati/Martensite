[package]
autotests = false
name = "martensite-cmath"
version = "0.3.6"
description = "Portable rounding for transcendental functions behind a typed Rust interface"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true

# Correctly rounded, pure-Rust transcendental functions. The exact pin keeps the
# kernel's recorded results stable; changing it is a reviewed behavior change (#201).
[dependencies]
metallic = "=0.3.0"

[features]
# Test-only instrumentation that compares every call with the platform libm the
# kernel used before #201 and can return either result; see
# docs/features/portable-transcendentals/attribution/README.md. Never enabled by a
# release build or a CI gate.
libm-attribution = []
# For verification against the platform C library: every transcendental function
# returns the platform libm result (behavior version 1 replay). Never enabled in
# releases or Martensite CI gates.
host-libm = []

# The workspace forbids unsafe code. This adapter is the one place allowed to
# declare foreign C math functions (the exact IEEE `remainder`), so it denies unsafe
# code and its FFI module opts in with `#[allow(unsafe_code)]` and a SAFETY comment
# (AGENTS.md, "Unsafe code exception"); clippy checks that comment. The other lints
# match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

# Test modules share one executable per crate to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
